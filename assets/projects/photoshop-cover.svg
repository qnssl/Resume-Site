<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Photoshop works</title>
  <desc id="desc">Dark indigo and violet gradient cover with a stylized Ps monogram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152f"/>
      <stop offset="0.52" stop-color="#302060"/>
      <stop offset="1" stop-color="#0b0d1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#9b7cff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9b7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a98bff"/>
      <stop offset="1" stop-color="#5b4bd8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1320" cy="-30" r="280" fill="none" stroke="#a98bff" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="1320" cy="-30" r="220" fill="none" stroke="#a98bff" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="112" y="112" width="176" height="176" rx="22" fill="none" stroke="#c7bbff" stroke-opacity="0.7" stroke-width="5"/>
  <text x="200" y="200" text-anchor="middle" dominant-baseline="central" fill="#f6f2ff" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="-10">Ps</text>
  <text x="112" y="688" fill="#f6f2ff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="8">PHOTOSHOP</text>
  <text x="118" y="754" fill="#c7bbff" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="5">GRAPHICS / VISUAL STUDIES</text>
  <path d="M112 808H520" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1110 790H1430" stroke="#c7bbff" stroke-opacity="0.5" stroke-width="2"/>
</svg>
