<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrator works</title>
  <desc id="desc">Dark charcoal and warm orange gradient cover with a stylized Ai monogram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17100d"/>
      <stop offset="0.5" stop-color="#552518"/>
      <stop offset="1" stop-color="#1b1715"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#ff7a32" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#ff7a32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffb36f"/>
      <stop offset="1" stop-color="#e4511a"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#fff" fill-opacity="0.11"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <path d="M980 0C1260 100 1390 260 1600 300" fill="none" stroke="#ffb36f" stroke-opacity="0.2" stroke-width="3"/>
  <path d="M1040 0C1320 100 1450 230 1600 250" fill="none" stroke="#ffb36f" stroke-opacity="0.12" stroke-width="3"/>
  <rect x="112" y="112" width="176" height="176" rx="22" fill="none" stroke="#ffb36f" stroke-opacity="0.78" stroke-width="5"/>
  <text x="200" y="200" text-anchor="middle" dominant-baseline="central" fill="#fff3e8" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="700" letter-spacing="-7">Ai</text>
  <text x="112" y="688" fill="#fff3e8" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="8">ILLUSTRATOR</text>
  <text x="118" y="754" fill="#ffbf8b" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="5">GRAPHICS / VECTOR WORKS</text>
  <path d="M112 808H520" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1110 790H1430" stroke="#ffbf8b" stroke-opacity="0.5" stroke-width="2"/>
</svg>
